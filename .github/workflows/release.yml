name: release

on:
  workflow_dispatch:
    inputs:
      build_tag:
        description: "Tag to build(留空则从main最新提交构建)"
        required: false
        default: ""
      enable_latest_tag:
        description: "Enable latest tag for docker image"
        required: false
        type: boolean
        default: false
  #push:
  #  tags:
  #    - "v0.*"
  #    - "v1.*"

jobs:
  Build:
    name: build-binary
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Hello world
        run: uname -a

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.build_tag || github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: "16"
          cache: "yarn"
          cache-dependency-path: "web/yarn.lock"
      - name: Build web
        working-directory: web
        run: |
          yarn install --frozen-lockfile
          yarn run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: wsczx
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true

      - name: Pre bash
        shell: bash
        run: |
          appVer=`cat version`
          commitId=`git rev-parse HEAD`
          echo "APP_VER=$appVer" >> $GITHUB_ENV
          echo "commitId=$commitId" >> $GITHUB_ENV

          # 按版本号自动识别预发布：含 beta/alpha/rc/preview/dev 标识时标记为 Prerelease
          case "$appVer" in
            *beta*|*alpha*|*rc*|*preview*|*dev*) is_prerelease=true ;;
            *) is_prerelease=false ;;
          esac
          echo "APP_PRERELEASE=$is_prerelease" >> $GITHUB_ENV

          echo $appVer > version_info
          echo $commitId >> version_info
          echo $GITHUB_REF >> version_info
          echo $GITHUB_REF_NAME >> version_info

      - name: Extract changelog for current version
        id: changelog
        shell: bash
        run: |
          ver="${{ env.APP_VER }}"
          # 去掉可能的 v 前缀
          ver="${ver#v}"
          section=$(awk -v ver="v$ver" '
            BEGIN { found=0 }
            /^## / { found=0 }
            $0 == "## " ver { found=1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md)
          # 尝试不带 v 前缀匹配
          if [ -z "$section" ]; then
            section=$(awk -v ver="$ver" '
              BEGIN { found=0 }
              /^## / { found=0 }
              $0 == "## " ver { found=1; next }
              /^## / && found { exit }
              found { print }
            ' CHANGELOG.md)
          fi
          # 去掉首尾空行
          section=$(printf "%s\n" "$section" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' | sed '/./,$!d')
          if [ -z "$section" ]; then
            section="RemLink v${ver} 发布"
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$section" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          cache-from: type=gha,scope=remlink
          cache-to: type=gha,mode=max,scope=remlink
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            appVer=${{ env.APP_VER }}
            commitId=${{ env.commitId }}
          tags: |
            wsczx/remlink:${{ env.APP_VER }}
            ${{ ((github.event.inputs.enable_latest_tag == true || github.event.inputs.enable_latest_tag == 'true') && env.APP_PRERELEASE == 'false') && 'wsczx/remlink:latest' || '' }}

      - name: Build deploy binary
        shell: bash
        run: bash scripts/release.sh

      - name: Release to public repo (wsczx/RemLink)
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          owner: wsczx
          repo: RemLink
          tag: v${{ env.APP_VER }}
          name: RemLink v${{ env.APP_VER }}
          artifacts: artifact-dist/*
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          prerelease: ${{ env.APP_PRERELEASE }}
          body: ${{ steps.changelog.outputs.body }}

